name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb
          - platform: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-12
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - name: Install Linux packages for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - run: npm ci

      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Error 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be set in repository secrets'
            exit 1
          }
          New-Item -ItemType directory -Force -Path certificate | Out-Null
          [System.IO.File]::WriteAllText("$PWD/certificate/tempCert.txt", $env:WINDOWS_CERTIFICATE)
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item certificate/tempCert.txt -Force
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item certificate/certificate.pfx -Force
          $thumb = $imported.Thumbprint
          Export-Certificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath schedule-viewer-codesign.cer | Out-Null
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-sign-config.json'
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding utf8NoBOM
          $tauriArgs = "--bundles nsis --config $configPath"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_CLI_ARGS=$tauriArgs"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: schedule-viewer v__VERSION__
          releaseBody: |
            ## ダウンロード

            - **Ubuntu (22.04 以降, amd64)**: `schedule-viewer_*_amd64.deb` をダウンロードし、`sudo apt install ./schedule-viewer_*_amd64.deb` でインストール
            - **Windows (x64)**: `schedule-viewer_*_x64-setup.exe` を実行。同じ Release の `schedule-viewer-codesign.cer` を入れた PC では発行元が `schedule-viewer` と表示される

            Windows のインストーラは自己署名である。公開用証明書を入れていない PC では SmartScreen の確認が出る。入れ方は [開発ガイド](https://github.com/${{ github.repository }}/blob/main/docs/development.md#release-後に証明書を入れる) を参照してください。

            ローカルでのビルド手順は [開発ガイド](https://github.com/${{ github.repository }}/blob/main/docs/development.md#配布用ビルド) を参照してください。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'windows-latest' && env.TAURI_CLI_ARGS || format('--bundles {0}', matrix.bundles) }}

      - name: Upload code signing certificate to Release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "v${version}" schedule-viewer-codesign.cer --clobber

  checksums:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          mkdir -p dist-release
          gh release download "$tag" --dir dist-release --clobber
          rm -f dist-release/SHA256SUMS
          (cd dist-release && sha256sum -- * > SHA256SUMS)
          gh release upload "$tag" dist-release/SHA256SUMS --clobber

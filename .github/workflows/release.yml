name: Release

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  validate-release-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Validate version, branch, and tag
        id: check
        run: npx tsx scripts/check-release-push.ts

  prepare-stable-github-release:
    needs: validate-release-push
    if: needs.validate-release-push.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Create stable release before build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: npx tsx scripts/prepare-stable-github-release.ts

  release-deb:
    needs: [validate-release-push, prepare-stable-github-release]
    if: always() && needs.validate-release-push.result == 'success' && (needs.validate-release-push.outputs.prerelease == 'true' || needs.prepare-stable-github-release.result == 'success')
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - name: Install Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY must be set in repository secrets" >&2
            exit 1
          fi

      - name: Load release body prefix
        id: release_prefix
        shell: bash
        env:
          PRERELEASE: ${{ needs.validate-release-push.outputs.prerelease }}
        run: |
          repo="${{ github.repository }}"
          if [ "$PRERELEASE" = "true" ]; then
            body=$(cat scripts/release-body-beta.md)
          else
            body=$(sed "s|shkobayashi/schedule-viewer|${repo}|g" scripts/release-body-prefix.md)
          fi
          {
            echo 'body<<EOF'
            printf '%s\n' "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: schedule-viewer v__VERSION__
          releaseBody: ${{ steps.release_prefix.outputs.body }}
          releaseDraft: false
          prerelease: ${{ needs.validate-release-push.outputs.prerelease == 'true' }}
          args: --bundles deb --config src-tauri/tauri.release.json

      - name: Upload platform updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          node scripts/build-platform-latest-json.mjs \
            linux-x86_64 \
            "$version" \
            "src-tauri/target/release/bundle" \
            "${{ github.repository }}" \
            "latest-linux-x86_64.json"
          gh release upload "$tag" "latest-linux-x86_64.json" --clobber

  release-dmg:
    needs: [validate-release-push, prepare-stable-github-release]
    if: always() && needs.validate-release-push.result == 'success' && (needs.validate-release-push.outputs.prerelease == 'true' || needs.prepare-stable-github-release.result == 'success')
    permissions:
      contents: write
    environment: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY must be set in repository secrets" >&2
            exit 1
          fi

      - name: Load release body prefix
        id: release_prefix
        shell: bash
        env:
          PRERELEASE: ${{ needs.validate-release-push.outputs.prerelease }}
        run: |
          repo="${{ github.repository }}"
          if [ "$PRERELEASE" = "true" ]; then
            body=$(cat scripts/release-body-beta.md)
          else
            body=$(sed "s|shkobayashi/schedule-viewer|${repo}|g" scripts/release-body-prefix.md)
          fi
          {
            echo 'body<<EOF'
            printf '%s\n' "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: schedule-viewer v__VERSION__
          releaseBody: ${{ steps.release_prefix.outputs.body }}
          releaseDraft: false
          prerelease: ${{ needs.validate-release-push.outputs.prerelease == 'true' }}
          args: --bundles app,dmg --config src-tauri/tauri.release.json

      - name: Upload platform updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          bundle_root="src-tauri/target/release/bundle"
          macos_dir="${bundle_root}/macos"
          node scripts/build-platform-latest-json.mjs \
            darwin-aarch64 \
            "$version" \
            "$bundle_root" \
            "${{ github.repository }}" \
            "latest-darwin-aarch64.json"
          gh release upload "$tag" "latest-darwin-aarch64.json" --clobber
          for f in "${macos_dir}"/*.app.tar.gz; do
            [ -f "$f" ] || continue
            gh release upload "$tag" "$f" --clobber
            sig="${f}.sig"
            if [ -f "$sig" ]; then
              gh release upload "$tag" "$sig" --clobber
            fi
          done

  release-windows-nsis:
    needs: validate-release-push
    if: needs.validate-release-push.outputs.prerelease == 'true'
    permissions:
      contents: write
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY must be set in repository secrets" >&2
            exit 1
          fi

      - name: Import Windows code signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Error 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be set in repository secrets'
            exit 1
          }
          New-Item -ItemType directory -Force -Path certificate | Out-Null
          [System.IO.File]::WriteAllText("$PWD/certificate/tempCert.txt", $env:WINDOWS_CERTIFICATE)
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item certificate/tempCert.txt -Force
          $certificatePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $certificatePassword
          Remove-Item certificate/certificate.pfx -Force
          $thumb = $imported.Thumbprint
          Export-Certificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath schedule-viewer-codesign.cer | Out-Null
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-sign-config.json'
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding utf8NoBOM
          $releaseConfig = Join-Path $PWD 'src-tauri/tauri.release.json'
          $tauriArgs = "--bundles nsis --config $configPath --config $releaseConfig"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_CLI_ARGS=$tauriArgs"

      - name: Load release body prefix
        id: release_prefix
        shell: bash
        run: |
          repo="${{ github.repository }}"
          body=$(cat scripts/release-body-beta.md)
          {
            echo 'body<<EOF'
            printf '%s\n' "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: schedule-viewer v__VERSION__
          releaseBody: ${{ steps.release_prefix.outputs.body }}
          releaseDraft: false
          prerelease: true
          args: ${{ env.TAURI_CLI_ARGS }}

      - name: Upload platform updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          node scripts/build-platform-latest-json.mjs \
            windows-x86_64 \
            "$version" \
            "src-tauri/target/release/bundle" \
            "${{ github.repository }}" \
            "latest-windows-x86_64.json"
          gh release upload "$tag" "latest-windows-x86_64.json" --clobber

      - name: Upload code signing certificate to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "v${version}" schedule-viewer-codesign.cer --clobber

  release-windows-store:
    needs: [validate-release-push, prepare-stable-github-release]
    if: needs.validate-release-push.outputs.prerelease != 'true' && needs.prepare-stable-github-release.result == 'success'
    permissions:
      contents: read
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY must be set in repository secrets" >&2
            exit 1
          fi

      - name: Verify Microsoft Store secrets
        shell: bash
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          if [ -z "$MSSTORE_TENANT_ID" ]; then
            echo "MSSTORE_TENANT_ID must be set in repository secrets" >&2
            exit 1
          fi
          if [ -z "$MSSTORE_CLIENT_ID" ]; then
            echo "MSSTORE_CLIENT_ID must be set in repository secrets" >&2
            exit 1
          fi
          if [ -z "$MSSTORE_CLIENT_SECRET" ]; then
            echo "MSSTORE_CLIENT_SECRET must be set in repository secrets" >&2
            exit 1
          fi
          if [ -z "$MSSTORE_SELLER_ID" ]; then
            echo "MSSTORE_SELLER_ID must be set in repository secrets" >&2
            exit 1
          fi

      - name: Build Windows release (no installer bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm run tauri build -- --no-bundle --config src-tauri/tauri.release.json

      - name: Package unsigned MSIX for Microsoft Store
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1

      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Publish MSIX to Microsoft Store
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          msstore reconfigure `
            --tenantId $env:MSSTORE_TENANT_ID `
            --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID `
            --clientSecret $env:MSSTORE_CLIENT_SECRET
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msixVersion = "$version.0"
          $msixPath = Join-Path $PWD "dist-msix/schedule-viewer_${msixVersion}_x64.msix"
          if (-not (Test-Path $msixPath)) {
            throw "MSIX not found: $msixPath"
          }
          msstore publish $msixPath -id 9PP41TRJ8ZT8

  checksums:
    needs:
      - validate-release-push
      - release-deb
      - release-dmg
      - release-windows-nsis
    if: >-
      always() &&
      needs.validate-release-push.result == 'success' &&
      needs.release-deb.result == 'success' &&
      needs.release-dmg.result == 'success' &&
      (needs.release-windows-nsis.result == 'success' || needs.release-windows-nsis.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.validate-release-push.outputs.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          repo="${{ github.repository }}"
          mkdir -p dist-release
          gh release download "$tag" --dir dist-release --clobber
          if [ "$PRERELEASE" = "true" ]; then
            node scripts/merge-latest-json.mjs \
              --require linux-x86_64 \
              --require darwin-aarch64 \
              --require windows-x86_64 \
              dist-release/latest-linux-x86_64.json \
              dist-release/latest-darwin-aarch64.json \
              dist-release/latest-windows-x86_64.json \
              dist-release/latest.json
          else
            node scripts/merge-latest-json.mjs \
              --require linux-x86_64 \
              --require darwin-aarch64 \
              dist-release/latest-linux-x86_64.json \
              dist-release/latest-darwin-aarch64.json \
              dist-release/latest.json
          fi
          gh release upload "$tag" dist-release/latest.json --clobber
          rm -f dist-release/SHA256SUMS
          (cd dist-release && sha256sum -- * > SHA256SUMS)
          gh release upload "$tag" dist-release/SHA256SUMS --clobber
          if [ "$PRERELEASE" = "true" ]; then
            cp scripts/release-body-beta.md dist-release/release-body.md
          else
            sed "s|shkobayashi/schedule-viewer|${repo}|g" scripts/release-body-prefix.md > dist-release/release-body-prefix.md
            npx tsx scripts/build-release-notes.ts "$version" "$repo" dist-release/release-body-prefix.md CHANGELOG.md dist-release/release-body.md
          fi
          gh release edit "$tag" --notes-file dist-release/release-body.md
          if [ "$PRERELEASE" != "true" ]; then
            GITHUB_SHA="${{ github.sha }}" GITHUB_REPOSITORY="${{ github.repository }}" \
              npx tsx scripts/publish-updater-channel.ts dist-release/latest.json
            GITHUB_REPOSITORY="${{ github.repository }}" \
              npx tsx scripts/finalize-stable-github-release-latest.ts
          fi

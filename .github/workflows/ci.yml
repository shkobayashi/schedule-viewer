name: CI

on:
  pull_request:
    branches: [develop, main, next, feature-436]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      manual: ${{ steps.filter.outputs.manual }}
      agentdocs: ${{ steps.filter.outputs.agentdocs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          git diff --name-only "$BASE" "$HEAD" | bash scripts/ci-changed-path-flags.sh

  frontend:
    needs: changes
    # TODO(cursor/issue-543): Remove draft-PR skip before leaving draft.
    if: needs.changes.outputs.frontend == 'true' && github.head_ref != 'cursor/issue-543-docs-ci-d1f0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run build
      - run: npm run lint
      - run: npm run check:mcp-tool-names
      - run: npm run check:operation-entries
      - run: npm run check:regression-coverage
      # Circular imports: madge vs scripts/madge-circular-baseline.json (non-zero cycles fail the job).
      - run: npm run check:madge-circular-baseline
      - run: npm run test:ci
      # jscpd only. The script always exits 0. Above scripts/check-architecture-warn.mjs --threshold it logs a warning.
      - run: npm run check:architecture-warn
      - run: npm run check:schedule
      - run: npm run check:calendar
      - run: npm run check:members
      - run: node --test scripts/how-to-citations.test.mjs
      - run: npm run build:validate-skill
      - name: how-to manual folder has no untracked or dirty files after generation
        run: test -z "$(git status --porcelain .cursor/skills/how-to/manual/)"
      - run: npm audit --audit-level=high
      - run: git diff --exit-code src/model/generated docs/schedule.schema.json .cursor/skills/write-schedule/schedule.schema.json .cursor/skills/write-schedule/scripts/validate-schedule.bundle.mjs docs/calendar.schema.json .cursor/skills/write-calendar/calendar.schema.json .cursor/skills/write-calendar/scripts/validate-calendar.bundle.mjs docs/members.schema.json .cursor/skills/write-members/members.schema.json .cursor/skills/write-members/scripts/validate-members.bundle.mjs docs/workspace.schema.json .cursor/skills/write-workspace/workspace.schema.json .cursor/skills/write-workspace/scripts/validate-workspace.bundle.mjs docs/field-extensions.schema.json .cursor/skills/write-fields/field-extensions.schema.json .cursor/skills/write-fields/scripts/validate-field-extensions.bundle.mjs docs/colors.schema.json .cursor/skills/write-colors/colors.schema.json .cursor/skills/write-colors/scripts/validate-colors.bundle.mjs docs/user-manual.md docs/user-manual/getting-started.md docs/user-manual/find-by-intent.md docs/user-manual/tutorial.md docs/user-manual/features.md docs/user-manual/privacy.md .cursor/skills/how-to/manual/user-manual.md .cursor/skills/how-to/manual/getting-started.md .cursor/skills/how-to/manual/find-by-intent.md .cursor/skills/how-to/manual/tutorial.md .cursor/skills/how-to/manual/features.md .cursor/skills/how-to/manual/privacy.md

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - name: Install Linux packages for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}
      - name: Install xvfb (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      # TODO(cursor/issue-543): Revert to `cargo test --locked` before leaving draft.
      # Filtered to mcp_running_app failures from CI run 43876490069 (11 Linux, 5 Windows).
      - name: cargo test (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          if [ "${{ github.head_ref }}" = 'cursor/issue-543-docs-ci-d1f0' ]; then
            xvfb-run -a cargo test --locked --test mcp_running_app -- \
              foreign_schedule_viewer_process_fails_without_sending_tools \
              filtered_tasks_follows_the_front_window_status_filter \
              focus_window_and_same_path_second_process_both_set_front_to_main \
              open_new_window_adds_the_third_file_and_keeps_the_first_two_file_and_folder \
              open_new_window_keeps_process_alive_and_both_windows_return_current_schedule \
              open_new_window_same_path_twice_adds_two_distinct_labels \
              open_new_window_while_main_is_dirty_keeps_the_edited_date_and_adds_a_window \
              open_new_window_with_bad_workspace_keeps_sample_row_without_attached_file \
              open_new_window_workspace_persists_workspace_path_and_restart \
              open_new_window_writes_correlated_diagnostic_trace \
              second_process_same_path_focuses_newer_window_and_keeps_unsaved_date_and_file_bytes
          else
            xvfb-run -a cargo test --locked
          fi
      - name: cargo test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: src-tauri
        run: |
          if [ "${{ github.head_ref }}" = 'cursor/issue-543-docs-ci-d1f0' ]; then
            cargo test --locked --test mcp_running_app -- \
              baseline_diffs_after_screen_edit_and_file_edit_has_screen_file_and_class_lines \
              edit_plan_changes_one_date_keeps_mtime_undo_restores_and_save_writes_that_date \
              foreign_schedule_viewer_process_fails_without_sending_tools \
              open_windows_lists_main_and_schedule_2_with_file_and_folder_and_only_main_front \
              six_reads_leave_open_windows_front_on_main
          else
            cargo test --locked
          fi

  agentdocs:
    needs: changes
    # TODO(cursor/issue-543): Remove draft-PR skip before leaving draft.
    if: needs.changes.outputs.agentdocs == 'true' && github.head_ref != 'cursor/issue-543-docs-ci-d1f0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm run check:agent-docs
      - run: node --test scripts/check-agent-docs.test.mjs

  manual:
    needs: changes
    # TODO(cursor/issue-543): Remove draft-PR skip before leaving draft.
    if: needs.changes.outputs.manual == 'true' && github.head_ref != 'cursor/issue-543-docs-ci-d1f0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:manual-site
      - run: node --test scripts/how-to-citations.test.mjs
      - run: npm run build:validate-skill
      - name: how-to manual folder has no untracked or dirty files after generation
        run: test -z "$(git status --porcelain .cursor/skills/how-to/manual/)"
      - run: git diff --exit-code docs/user-manual.md docs/user-manual/getting-started.md docs/user-manual/find-by-intent.md docs/user-manual/tutorial.md docs/user-manual/features.md docs/user-manual/privacy.md .cursor/skills/how-to/manual/user-manual.md .cursor/skills/how-to/manual/getting-started.md .cursor/skills/how-to/manual/find-by-intent.md .cursor/skills/how-to/manual/tutorial.md .cursor/skills/how-to/manual/features.md .cursor/skills/how-to/manual/privacy.md

  ci:
    name: ci
    needs: [changes, frontend, rust, manual, agentdocs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful jobs
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] && [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "frontend job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.rust }}" = "true" ] && [ "${{ needs.rust.result }}" != "success" ]; then
            echo "rust job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.manual }}" = "true" ] && [ "${{ needs.manual.result }}" != "success" ]; then
            echo "manual job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.agentdocs }}" = "true" ] && [ "${{ needs.agentdocs.result }}" != "success" ]; then
            echo "agentdocs job did not succeed"
            exit 1
          fi

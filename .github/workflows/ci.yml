name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:schedule
      - run: npm run build:validate-skill
      - run: git diff --exit-code docs/schedule.schema.json .cursor/skills/write-schedule/schedule.schema.json
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

name: CI

on:
  pull_request:
    branches: [develop, main, next]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      manual: ${{ steps.filter.outputs.manual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          frontend=false
          rust=false
          manual=false
          while IFS= read -r file; do
            case "$file" in
              src-tauri/*|rust-toolchain.toml)
                rust=true
                ;;
              .github/workflows/*)
                frontend=true
                rust=true
                ;;
              docs/user-manual/*|docs/user-manual.md|scripts/build-user-manual-site.mjs|scripts/manual-site/*|.github/workflows/pages.yml)
                manual=true
                ;;
              index.html|src/*|scripts/*|docs/schedule.schema.json|docs/members.schema.json|docs/calendar.schema.json|examples/*|package.json|package-lock.json|eslint.config.js|vite.config.ts|tsconfig.json|tsconfig.node.json|vitest.config.ts|.cursor/skills/write-schedule/*|.cursor/skills/write-calendar/*|.cursor/skills/write-members/*)
                frontend=true
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD")
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "manual=$manual" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check:schedule
      - run: npm run check:calendar
      - run: npm run check:members
      - run: npm run build:validate-skill
      - run: npm audit --audit-level=high
      - run: git diff --exit-code src/model/generated docs/schedule.schema.json .cursor/skills/write-schedule/schedule.schema.json .cursor/skills/write-schedule/scripts/validate-schedule.bundle.mjs docs/calendar.schema.json .cursor/skills/write-calendar/calendar.schema.json .cursor/skills/write-calendar/scripts/validate-calendar.bundle.mjs docs/members.schema.json .cursor/skills/write-members/members.schema.json .cursor/skills/write-members/scripts/validate-members.bundle.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - name: Install Linux packages for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - id: rust-toolchain
        name: Read rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          if [ -z "$channel" ] || [ -z "$components" ]; then
            echo "rust-toolchain.toml must set channel and components" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  manual:
    needs: changes
    if: needs.changes.outputs.manual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:manual-site

  ci:
    name: ci
    needs: [changes, frontend, rust, manual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful jobs
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] && [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "frontend job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.rust }}" = "true" ] && [ "${{ needs.rust.result }}" != "success" ]; then
            echo "rust job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.manual }}" = "true" ] && [ "${{ needs.manual.result }}" != "success" ]; then
            echo "manual job did not succeed"
            exit 1
          fi
